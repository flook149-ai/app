<style>
  :root{
    --bg-top:#dbe6ef;
    --bg-bottom:#eef2f6;
    --surface:#ffffff;
    --surface-soft:#f3f7fa;
    --primary:#4a6fa5;
    --primary-dark:#2e4c73;
    --accent:#8fb8da;
    --accent-soft:#dbe9f4;
    --text:#2c3947;
    --muted:#71869b;
    --border:#dde6ee;
    --danger:#c97575;
    --success:#5f9e82;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 8px 24px rgba(46,76,115,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Sarabun',sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 45%, var(--bg-bottom) 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 48px 0;position:relative;}
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  button{font-family:'Sarabun',sans-serif;cursor:pointer;}
  ::selection{background:var(--accent-soft);}

.hero{padding:38px 24px 28px 24px;text-align:center;position:relative;overflow:hidden;}
  .breath-wrap{width:96px;height:96px;margin:0 auto 18px auto;display:flex;align-items:center;justify-content:center;position:relative;}
  .breath-ring{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, var(--accent) 60%, var(--primary) 100%);
    animation:breathe 5s ease-in-out infinite;
    box-shadow:0 10px 30px rgba(74,111,165,0.35);
  }
  @keyframes breathe{0%,100%{transform:scale(0.86);opacity:0.85;}50%{transform:scale(1.08);opacity:1;}}
  @media (prefers-reduced-motion: reduce){.breath-ring{animation:none;}}
  .hero h1{font-size:28px;font-weight:700;color:var(--primary-dark);margin:0 0 6px 0;letter-spacing:0.5px;}
  .hero p{margin:0;color:var(--muted);font-size:14.5px;}

.section{padding:6px 20px 0 20px;}
  .eyebrow{
    font-family:'Prompt',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:1.6px;
    color:var(--primary);text-transform:uppercase;margin:22px 4px 12px 4px;
  }

.card-list{display:flex;flex-direction:column;gap:10px;}
  .item-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 16px;
    display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;width:100%;
  }
  .item-card:active{transform:scale(0.98);}
  .item-icon{
    width:44px;height:44px;border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:21px;flex-shrink:0;
  }
  .item-body{flex:1;min-width:0;}
  .item-title{font-family:'Prompt',sans-serif;font-weight:600;font-size:15.5px;color:var(--text);margin:0 0 2px 0;}
  .item-desc{font-size:12.8px;color:var(--muted);margin:0;line-height:1.4;}
  .item-chevron{color:var(--accent);font-size:18px;flex-shrink:0;}

.view{padding:18px 20px 8px 20px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--primary);
    font-size:14px;font-weight:500;padding:8px 4px;margin-bottom:8px;
  }
  .view-title{font-size:21px;font-weight:700;color:var(--primary-dark);margin:2px 0 4px 0;}
  .view-sub{font-size:13px;color:var(--muted);margin:0 0 20px 0;line-height:1.5;}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .btn{
    border:none;border-radius:var(--radius-sm);
    padding:12px 18px;font-size:14.5px;font-weight:600;font-family:'Sarabun',sans-serif;
    width:100%;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-soft{background:var(--accent-soft);color:var(--primary-dark);}
  .btn:disabled{opacity:0.45;}
  .input{
    width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:14.5px;font-family:'Sarabun',sans-serif;color:var(--text);
    background:var(--surface-soft);
  }
  .input:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .muted-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .error-note{font-size:12.5px;color:var(--danger);margin-top:10px;line-height:1.5;}

.player-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent-soft);color:var(--primary-dark);
    border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;margin:3px 4px 3px 0;
  }
  .room-code{
    font-family:'Prompt',sans-serif;font-size:26px;font-weight:700;letter-spacing:4px;
    color:var(--primary-dark);text-align:center;margin:6px 0 14px 0;
  }

.board-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .board-card{
    aspect-ratio:1/1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--primary);color:transparent;
    border:none;transition:transform .12s ease;
  }
  .board-card.open{background:var(--surface);color:var(--text);border:1.5px solid var(--accent);}
  .board-card.matched{background:var(--success);color:#fff;opacity:0.55;}
  .board-card:active{transform:scale(0.94);}
  .score-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .score-chip{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:12.5px;color:var(--text);
  }
  .score-chip.me{border-color:var(--primary);color:var(--primary-dark);font-weight:600;}

.chat-window{
    height:340px;overflow-y:auto;background:var(--surface-soft);
    border-radius:var(--radius-md);padding:14px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;}
  .msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;}

textarea.input{resize:vertical;min-height:120px;font-family:'Sarabun',sans-serif;line-height:1.6;}
  .entry{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:13px 15px;margin-bottom:10px;
  }
  .entry-time{font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .entry-text{font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .empty-note{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}

.tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab-btn{
    flex:1;border-radius:999px;padding:10px 12px;border:1px solid var(--border);
    background:var(--surface-soft);color:var(--muted);font-weight:600;
  }
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.public-post{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px;box-shadow:var(--shadow);margin-bottom:12px;
  }
  .post-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;
  }
  .post-author{font-weight:600;color:var(--primary-dark);font-size:14px;}
  .post-meta{font-size:11.5px;color:var(--muted);}
  .visibility-badge{
    display:inline-block;font-size:11.5px;padding:4px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--primary-dark);margin-left:8px;
  }
  .comment-list{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
    display:flex;flex-direction:column;gap:8px;
  }
  .comment-item{
    background:var(--surface-soft);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45;
  }
  .comment-meta{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .mini-note{font-size:12px;color:var(--muted);margin:6px 0 0 0;line-height:1.5;}

.spinner-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin:0 2px;animation:blink 1.3s infinite;}
  .spinner-dot:nth-child(2){animation-delay:.2s;}
  .spinner-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
</style>

<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* storage helpers */
async function fGet(path){
  try{
    const snap = await db.ref(path).get();
    return snap.exists() ? snap.val() : null;
  }catch(e){
    console.error('firebase get', path, e);
    return null;
  }
}
async function fSet(path, value){
  try{
    await db.ref(path).set(value);
    return true;
  }catch(e){
    console.error('firebase set', path, e);
    return false;
  }
}
async function fDel(path){
  try{
    await db.ref(path).remove();
    return true;
  }catch(e){
    console.error('firebase del', path, e);
    return false;
  }
}
async function fPush(path, value){
  try{
    await db.ref(path).push(value);
    return true;
  }catch(e){
    console.error('firebase push', path, e);
    return false;
  }
}
async function fPushReturnKey(path, value){
  try{
    const ref = db.ref(path).push();
    await ref.set(value);
    return ref.key;
  }catch(e){
    console.error('firebase push key', path, e);
    return null;
  }
}
async function fIncrementScore(path){
  try{
    await db.ref(path).transaction(cur => (cur || 0) + 1);
  }catch(e){
    console.error('firebase txn', path, e);
  }
}

function lGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

function uid(){ return Math.random().toString(36).slice(2,10); }
function roomCode(){ const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c += s[Math.floor(Math.random()*s.length)]; return c; }
function formatTime(ts){ return new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function nowStr(){ return formatTime(Date.now()); }
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
function scrollToBottom(id){ const el=document.getElementById(id); if(el) el.scrollTop = el.scrollHeight; }

/* state */
let ME_ID = null, ME_NAME = null;
let view = 'home';
let pollTimer = null;
let currentRoomCode = null;
let currentChatCode = null;
let ventView = 'compose';
let ventVisibility = 'private';
let ventDraft = '';
let lastError = null;

/* vent public feed cache/listener */
let ventPublicPostsCache = [];
let ventPublicListenerStarted = false;

/* board heartbeat */
let boardHeartbeatTimer = null;
function startBoardHeartbeat(){
  stopBoardHeartbeat();
  boardHeartbeatTimer = setInterval(async ()=>{
    if(view !== 'boardroom' || !currentRoomCode || !ME_ID) return;
    await fSet(`rooms/${currentRoomCode}/players/${ME_ID}/lastSeen`, Date.now());
  }, 5000);
}
function stopBoardHeartbeat(){
  if(boardHeartbeatTimer){
    clearInterval(boardHeartbeatTimer);
    boardHeartbeatTimer = null;
  }
}

/* board presence/active helpers */
function getActiveBoardPlayers(room){
  const players = room.players || {};
  const now = Date.now();
  const active = {};
  for(const [id, p] of Object.entries(players)){
    if(!p) continue;
    if(id === ME_ID){
      active[id] = p;
      continue;
    }
    if(!p.lastSeen) continue;
    if(now - p.lastSeen <= 12000){
      active[id] = p;
    }
  }
  return active;
}

/* identity */
function ensureIdentity(){
  ME_NAME = lGet('nickname');
  return new Promise((resolve)=>{
    const unsub = firebase.auth().onAuthStateChanged((user)=>{
      if(user){
        ME_ID = user.uid;
        unsub();
        resolve();
      }
    });
    firebase.auth().signInAnonymously().catch((e)=>{
      console.error('anonymous sign-in failed', e);
      lastError = 'เชื่อมต่อระบบยืนยันตัวตนไม่สำเร็จ ลองรีเฟรชหน้าเว็บ';
      resolve();
    });
  });
}

/* navigation */
function goto(v){
  view = v;
  lastError = null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if(v !== 'boardroom') stopBoardHeartbeat();
  if(v !== 'vent') stopVentPublicFeedListener();
  render();
}

/* root render */
async function render(){
  const app = document.getElementById('app');
  if(view === 'home') app.innerHTML = renderHome();
  else if(view === 'boardgame') app.innerHTML = renderBoardGameEntry();
  else if(view === 'boardroom') app.innerHTML = await renderBoardRoom();
  else if(view === 'chat') app.innerHTML = await renderChatEntry();
  else if(view === 'chatroom') app.innerHTML = await renderChatRoom();
  else if(view === 'vent') app.innerHTML = await renderVent();
  bindEvents();

if(view === 'boardroom'){
    await refreshBoardRoom(true);
    startBoardHeartbeat();
    if(!pollTimer){
      pollTimer = setInterval(()=>{ if(view === 'boardroom') refreshBoardRoom(false); }, 1600);
    }
  } else if(view === 'chatroom'){
    await refreshChatRoom(true);
    setTimeout(()=>{
      const input = document.getElementById('chat-msg-input');
      if(input) input.focus();
    }, 50);
    if(!pollTimer){
      pollTimer = setInterval(()=>{ if(view === 'chatroom') refreshChatRoom(false); }, 1200);
    }
  } else if(view === 'vent' && ventView === 'public'){
    startVentPublicFeedListener();
  }
}

}

async function armBoardPresence(code){
  try{
    db.ref('rooms/'+code+'/players/'+ME_ID).onDisconnect().remove();
  }catch(e){
    console.error(e);
  }

async function bgQuickMatch(){

/* boardgame room */
function getBoardPlayers(room){
  const players = getActiveBoardPlayers(room);
  const ids = Object.keys(players);
  const sorted = ids.map(id=>({id, ...players[id]})).sort((a,b)=>(b.score||0)-(a.score||0));
  return {players, ids, sorted};
}
function getBoardMessages(room){
  const raw = room.chatMessages || {};
  return Object.values(raw).sort((a,b)=>(a.time||0)-(b.time||0));
}
function buildBoardScoreStrip(room){
  const {players, ids} = getBoardPlayers(room);
  if(room.status !== 'playing') return '';
  return `
    <div class="score-strip">
      ${ids.map(id=>`<span class="score-chip ${id===ME_ID?'me':''}">${escapeHtml(players[id].name)}: ${players[id].score||0}★</span>`).join('')}
    </div>
  `;
}
function buildBoardStatusPanel(room){
  const {players, ids} = getBoardPlayers(room);
  if(room.status === 'waiting'){
    return `
      <div class="panel">
        <div class="room-code">${escapeHtml(room.code || currentRoomCode || '')}</div>
        <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:-6px;">แชร์รหัสนี้ให้เพื่อน หรือรอระบบจับคู่ให้</p>
        <div style="margin:16px 0 4px 0;">
          ${ids.map(id=>`<span class="player-pill">🙂 ${escapeHtml(players[id].name)}${id===ME_ID?' (คุณ)':''}</span>`).join('')}
        </div>
        <p class="muted-note">รอผู้เล่น… <span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span> (${ids.length}/4)</p>
        <button class="btn btn-primary" style="margin-top:14px;" data-action="bg-start" ${ids.length<2?'disabled':''}>เริ่มเกม (${ids.length}/4 คน)</button>
      </div>
    `;
  }
  return `
    <div class="panel">
      <p class="view-sub" style="margin:0;">กำลังเล่นอยู่ · ผู้เล่น ${ids.length} คน</p>
    </div>
  `;
}
function buildBoardWinnerPanel(room){
  const cards = room.cards || [];
  const allMatched = cards.length > 0 && cards.every(c=>c.matchedBy);
  if(!allMatched) return '';
  const {sorted} = getBoardPlayers(room);
  const topScore = Math.max(...sorted.map(p=>p.score||0), 0);
  const winners = sorted.filter(p=>(p.score||0)===topScore).map(p=>escapeHtml(p.name)).join(', ');
  return `
    <div class="panel" style="text-align:center;">
      <p style="font-family:Prompt;font-weight:600;font-size:17px;color:var(--primary-dark);">🎉 จบเกมแล้ว!</p>
      <p class="view-sub" style="margin:6px 0 0 0;">ผู้ชนะ: ${winners || '-'}</p>
      <button class="btn btn-soft" style="margin-top:10px;" data-action="nav" data-view="boardgame">เล่นห้องใหม่</button>
    </div>
  `;
}
function buildBoardGrid(room){
  if(room.status !== 'playing') return '';
  const cards = room.cards || [];
  const flipped = room.flipped || {};
  const symbols = ['🌤️','🌊','🌿','🍃','🌙','⭐','🌸','🍀'];

return cards.map((c,i)=>{
    const isFlipped = !!flipped[i];
    const open = c.matchedBy || isFlipped;
    const cls = c.matchedBy ? 'matched' : (isFlipped ? 'open' : '');
    return `<button class="board-card ${cls}" data-action="bg-flip" data-idx="${i}">${open?symbols[c.value]:''}</button>`;
  }).join('');
}

/* board chat */
function buildBoardChatMessages(room){
  const messages = getBoardMessages(room);
  return messages.length === 0
    ? `<div class="msg sys">ยังไม่มีข้อความในห้องนี้</div>`
    : messages.map(m=>{
        if(m.senderId === 'sys') return `<div class="msg sys">${escapeHtml(m.text)}</div>`;
        const isMe = m.senderId === ME_ID;
        const name = m.senderName || (isMe ? (ME_NAME || 'คุณ') : 'เพื่อน');
        return `<div class="msg ${isMe?'me':'them'}"><div style="font-size:11px;opacity:.8;margin-bottom:4px;">${escapeHtml(name)}</div>${escapeHtml(m.text)}</div>`;
      }).join('');
}

async function refreshBoardRoom(forceScroll){
  if(view !== 'boardroom') return;
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room){ goto('boardgame'); return; }

const title = document.getElementById('boardroom-title');
  const winnerPanel = document.getElementById('board-winner-panel');
  const scoreStrip = document.getElementById('board-score-strip');
  const statusPanel = document.getElementById('board-status-panel');
  const chatPanel = document.getElementById('bg-chat-panel');
  const chatWindow = document.getElementById('bg-chat-window');
  const grid = document.getElementById('board-grid');
  const note = document.getElementById('board-note');

const activeChatInput = document.getElementById('bg-chat-input');
  const wasFocused = activeChatInput && document.activeElement === activeChatInput;
  const draft = activeChatInput ? activeChatInput.value : '';

if(title) title.innerHTML = `🎲 ${room.roomName ? escapeHtml(room.roomName) : ('ห้อง '+escapeHtml(room.code || currentRoomCode || ''))}`;
  if(winnerPanel) winnerPanel.innerHTML = buildBoardWinnerPanel(room);
  if(scoreStrip) scoreStrip.innerHTML = buildBoardScoreStrip(room);
  if(statusPanel) statusPanel.innerHTML = buildBoardStatusPanel(room);
  if(grid) grid.innerHTML = buildBoardGrid(room);

if(chatPanel){
    if(chatWindow){
      chatWindow.innerHTML = buildBoardChatMessages(room);
    } else {
      chatPanel.innerHTML = buildBoardChatPanel(room);
    }
  }

if(note){
    note.innerHTML = room.status === 'playing'
      ? 'แตะการ์ดเพื่อเปิด จับคู่สัญลักษณ์ให้ตรงกันเพื่อได้คะแนน'
      : '';
    note.style.display = room.status === 'playing' ? '' : 'none';
  }

bindEvents();

if(wasFocused){
    const input = document.getElementById('bg-chat-input');
    if(input){
      input.value = draft;
      input.focus({ preventScroll: true });
      if(input.setSelectionRange){
        input.setSelectionRange(draft.length, draft.length);
      }
    }
  }

if(forceScroll) scrollToBottom('bg-chat-window');
}

async function bgStart(){
  if(!currentRoomCode) return;
  await fSet('rooms/'+currentRoomCode+'/status', 'playing');

  refreshBoardRoom(true);
}
async function bgFlip(idx){
  const room = await fGet('rooms/'+currentRoomCode);
  if(!room || room.status !== 'playing') return;
  const cards = room.cards || [];
  const flipped = room.flipped || {};
  const card = cards[idx];
  if(!card || card.matchedBy) return;
  if(flipped[idx]) return;
  if(Object.keys(flipped).length >= 2) return;

flipped[idx] = true;
  await fSet('rooms/'+currentRoomCode+'/flipped', flipped);
  refreshBoardRoom(true);

const openIdx = Object.keys(flipped).map(Number);
  if(openIdx.length === 2){
    const [a,b] = openIdx;
    if(cards[a].value === cards[b].value){
      await fSet('rooms/'+currentRoomCode+'/cards/'+a+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/cards/'+b+'/matchedBy', ME_ID);
      await fSet('rooms/'+currentRoomCode+'/flipped', {});
      await fIncrementScore('rooms/'+currentRoomCode+'/players/'+ME_ID+'/score');
      await fPush('rooms/'+currentRoomCode+'/chatMessages', {
        senderId:'sys',
        senderName:'ระบบ',
        text:(ME_NAME||'ผู้เล่น')+' จับคู่ได้สำเร็จ!',
        time:Date.now()
      });
      refreshBoardRoom(true);
    } else {
      setTimeout(async ()=>{
        const room2 = await fGet('rooms/'+currentRoomCode);
        if(!room2) return;
        const flipped2 = room2.flipped || {};
        const keys2 = Object.keys(flipped2).map(Number);
        if(keys2.length === 2 && keys2.includes(a) && keys2.includes(b)){
          await fSet('rooms/'+currentRoomCode+'/flipped', {});
        }
        if(view === 'boardroom') refreshBoardRoom(true);
      }, 1100);
    }
  }
}

  const input = document.getElementById('bg-chat-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;

await fPush('rooms/'+currentRoomCode+'/chatMessages', {
    senderId: ME_ID,
    senderName: ME_NAME || 'เพื่อน',

  });

input.value = '';

}

    const room = await fGet('chatrooms/'+currentChatCode);
    if(room){
      await fDel('chatrooms/'+currentChatCode+'/players/'+ME_ID);
      const remaining = await fGet('chatrooms/'+currentChatCode+'/players');
      if(!remaining || Object.keys(remaining).length===0){
        await fDel('chatrooms/'+currentChatCode);
      }
    }
  }
  currentChatCode = null;
  goto('home');
}

/* vent */
function ventCaptureDraft(){
  const ta = document.getElementById('vent-text');
  if(ta) ventDraft = ta.value;
}
function stopVentPublicFeedListener(){
  if(!ventPublicListenerStarted) return;
  try{
    db.ref('vent_public_posts').off();
  }catch(e){}
  ventPublicListenerStarted = false;
}
function startVentPublicFeedListener(){
  if(ventPublicListenerStarted) return;
  ventPublicListenerStarted = true;
  db.ref('vent_public_posts').on('value', snap => {
    ventPublicPostsCache = normalizeVentPublicPosts(snap.val() || {});
    if(view === 'vent' && ventView === 'public'){
      render();
    }
  });
}
function ventSetView(mode){
  ventCaptureDraft();
  ventView = mode;
  if(mode !== 'public'){
    stopVentPublicFeedListener();
  }
  render();
}
function ventSetVisibility(mode){
  ventVisibility = mode;
  render();
}
function buildVentTabs(){
  return `
    <div class="tabs">
      <button class="tab-btn ${ventView==='compose'?'active':''}" data-action="vent-set-view" data-view="compose">เขียน</button>
      <button class="tab-btn ${ventView==='history'?'active':''}" data-action="vent-set-view" data-view="history">ข้อความเก่า</button>
      <button class="tab-btn ${ventView==='public'?'active':''}" data-action="vent-set-view" data-view="public">สาธารณะ</button>
    </div>
  `;
}
function renderVentCompose(){
  return `
    <div class="panel">
      <textarea class="input" id="vent-text" placeholder="วันนี้เป็นยังไงบ้าง…">${escapeHtml(ventDraft)}</textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn ${ventVisibility==='private'?'btn-primary':'btn-outline'}" data-action="vent-set-visibility" data-visibility="private">ส่วนตัว</button>
        <button class="btn ${ventVisibility==='public'?'btn-primary':'btn-outline'}" data-action="vent-set-visibility" data-visibility="public">สาธารณะ</button>
      </div>
      <button class="btn btn-primary" style="margin-top:12px;" data-action="vent-save">บันทึกข้อความ</button>
      <p class="muted-note">ส่วนตัว = เก็บในเครื่องของคุณ · สาธารณะ = คนอื่นเห็นและคอมเมนต์ได้</p>
    </div>

<div class="row">
      <button class="btn btn-soft" data-action="vent-set-view" data-view="history">📖 ดูข้อความที่เคยเขียน</button>
      <button class="btn btn-soft" data-action="vent-set-view" data-view="public">🌍 ดูฟีดสาธารณะ</button>
    </div>
  `;
}
function renderVentHistory(entries){
  if(entries.length===0) return `<p class="empty-note">ยังไม่มีข้อความที่บันทึกไว้</p>`;
  return entries.map(e=>`
    <div class="entry">
      <div class="entry-time">${escapeHtml(e.time)}</div>
      <div class="entry-text">${escapeHtml(e.text)}</div>
      <div class="mini-note">สถานะ: ${e.visibility==='public' ? 'สาธารณะ' : 'ส่วนตัว'}</div>
    </div>
  `).join('');
}
function renderPublicCommentList(comments){
  if(!comments || comments.length===0) return `<div class="mini-note">ยังไม่มีคอมเมนต์</div>`;
  return `
    <div class="comment-list">
      ${comments.map(c=>`
        <div class="comment-item">
          <div class="comment-meta">${escapeHtml(c.authorName || 'เพื่อน')} · ${escapeHtml(formatTime(c.createdAt || Date.now()))}</div>
          <div class="entry-text" style="font-size:13px;">${escapeHtml(c.text)}</div>
        </div>
      `).join('')}
    </div>
  `;
}
function normalizeVentPublicPosts(raw){
  return Object.keys(raw || {})
    .map(id => ({ id, ...raw[id] }))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
async function loadVentPublicPostsCache(){
  const raw = await fGet('vent_public_posts') || {};
  ventPublicPostsCache = normalizeVentPublicPosts(raw);
  return ventPublicPostsCache;
}
async function getPublicPosts(){
  return await loadVentPublicPostsCache();
}
function renderPublicPost(post){
  const comments = Object.values(post.comments || {}).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  return `
    <div class="public-post">
      <div class="post-head">
        <div>
          <div class="post-author">${escapeHtml(post.authorName || 'เพื่อน')}
            <span class="visibility-badge">สาธารณะ</span>
          </div>
          <div class="post-meta">${escapeHtml(formatTime(post.createdAt || Date.now()))}</div>
        </div>
        ${post.authorId===ME_ID ? `<span class="mini-note">ของฉัน</span>` : ``}
      </div>
      <div class="entry-text">${escapeHtml(post.text || '')}</div>

${post.authorId === ME_ID ? `
        <button class="btn btn-outline" style="margin-top:10px;" data-action="vent-delete-post" data-post-id="${post.id}">
          ลบโพสต์
        </button>
      ` : ``}

${renderPublicCommentList(comments)}

<div class="row" style="margin-top:10px;">
        <input class="input" id="comment-input-${post.id}" placeholder="เขียนคอมเมนต์…"/>
        <button class="btn btn-outline" style="flex:0 0 92px;" data-action="vent-comment-send" data-post-id="${post.id}">ส่งคอมเมนต์</button>
      </div>
    </div>
  `;
}
async function renderVentPublicFeed(){
  startVentPublicFeedListener();
  if(ventPublicPostsCache.length===0){
    await loadVentPublicPostsCache();
  }
  const posts = ventPublicPostsCache;
  if(posts.length===0) return `<p class="empty-note">ยังไม่มีข้อความสาธารณะ</p>`;
  return posts.map(renderPublicPost).join('');
}
async function renderVent(){
  const raw = lGet('vent_entries');
  let entries = [];
  if(raw){
    try{ entries=JSON.parse(raw); }catch(e){ entries=[]; }
  }
  entries = entries.slice().reverse();

const publicFeed = ventView==='public' ? await renderVentPublicFeed() : '';

return `
  <div class="view">
    <button class="back-btn" data-action="nav" data-view="home">← กลับหน้าหลัก</button>
    <h2 class="view-title">📝 พื้นที่ระบาย</h2>
    <p class="view-sub">เขียนสิ่งที่อยู่ในใจได้อย่างอิสระ ข้อความส่วนตัวเก็บไว้ในเครื่องของคุณ ส่วนข้อความสาธารณะคนอื่นจะเห็นและคอมเมนต์ได้</p>

${buildVentTabs()}

${ventView==='compose' ? renderVentCompose() : ''}

${ventView==='history' ? `
      <button class="btn btn-outline" style="margin-bottom:14px;" data-action="vent-set-view" data-view="compose">← กลับไปเขียนข้อความใหม่</button>
      ${renderVentHistory(entries)}
    ` : ''}

${ventView==='public' ? `
      <button class="btn btn-outline" style="margin-bottom:14px;" data-action="vent-set-view" data-view="compose">← กลับไปเขียนข้อความใหม่</button>
      ${publicFeed}
    ` : ''}
  </div>`;
}
async function ventSave(){
  const ta = document.getElementById('vent-text');
  const text = ta ? ta.value.trim() : '';
  if(!text) return;

if(!ME_ID){
    lastError = 'กำลังเชื่อมต่อระบบยืนยันตัวตน กรุณารอสักครู่แล้วลองใหม่';
    render();
    return;
  }

const raw = lGet('vent_entries');
  let entries = [];
  if(raw){
    try{ entries=JSON.parse(raw); }catch(e){ entries=[]; }
  }

const entry = {
    id: uid(),
    text,
    time: nowStr(),
    visibility: ventVisibility
  };
  entries.push(entry);
  lSet('vent_entries', JSON.stringify(entries));

if(ventVisibility === 'public'){
    const authorName = ME_NAME || 'เพื่อนนิรนาม';
    const payload = {
      authorId: ME_ID,
      authorName,
      text,
      createdAt: Date.now(),
      comments: {}
    };

const key = await fPushReturnKey('vent_public_posts', payload);
    if(!key){
      lastError = 'บันทึกข้อความสาธารณะไม่สำเร็จ';
      render();
      return;
    }

ventPublicPostsCache = [{ id:key, ...payload }, ...ventPublicPostsCache];
    ventView = 'public';
    startVentPublicFeedListener();
  } else {
    ventView = 'history';
  }

ventDraft = '';
  if(ta) ta.value = '';
  render();
}
async function ventDeletePost(postId){
  if(!postId) return;
  if(!ME_ID){
    lastError = 'กำลังเชื่อมต่อระบบยืนยันตัวตน กรุณารอสักครู่';
    render();
    return;
  }
  await fDel('vent_public_posts/' + postId);
  await loadVentPublicPostsCache();
  render();
}
async function ventAddComment(postId){
  const input = document.getElementById('comment-input-'+postId);
  const text = input ? input.value.trim() : '';
  if(!text) return;

const authorName = ME_NAME || 'เพื่อนนิรนาม';
  await fPush('vent_public_posts/'+postId+'/comments', {
    authorId: ME_ID,
    authorName,
    text,
    createdAt: Date.now()
  });

if(input) input.value = '';
  render();
}

/* events */
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async () => {
      const action = el.getAttribute('data-action');
      if(action === 'ext') window.open(el.getAttribute('data-url'), '_blank');
      else if(action === 'nav') goto(el.getAttribute('data-view'));
      else if(action === 'bg-quickmatch') bgQuickMatch();
      else if(action === 'bg-createroom') bgCreateRoom();
      else if(action === 'bg-joincode') bgJoinCode();
      else if(action === 'bg-start') bgStart();
      else if(action === 'bg-flip') bgFlip(parseInt(el.getAttribute('data-idx')));
      else if(action === 'bg-leave') bgLeave();
      else if(action === 'bg-chat-send') bgChatSend();
      else if(action === 'chat-find') chatFind();
      else if(action === 'chat-cancel') chatCancel();
      else if(action === 'chat-send') chatSend();
      else if(action === 'chat-leave') chatLeave();
      else if(action === 'vent-save') ventSave();
      else if(action === 'vent-delete-post') ventDeletePost(el.getAttribute('data-post-id'));
      else if(action === 'vent-set-view') ventSetView(el.getAttribute('data-view'));
      else if(action === 'vent-set-visibility') ventSetVisibility(el.getAttribute('data-visibility'));
      else if(action === 'vent-comment-send') ventAddComment(el.getAttribute('data-post-id'));
    };
  });

const chatInput = document.getElementById('chat-msg-input');
  if(chatInput) chatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') chatSend(); });

const bgChatInput = document.getElementById('bg-chat-input');
  if(bgChatInput) bgChatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') bgChatSend(); });
}

/* init */
(async function init(){
  await ensureIdentity();
  render();
})();
</script>
